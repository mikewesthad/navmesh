packages:
  - packages/*

# Only install package versions that have been published for at least 7 days
# (in minutes). Reduces exposure to compromised releases that get pulled quickly.
minimumReleaseAge: 10080

allowBuilds:
  core-js: false
  cypress: false
  esbuild: false
  fsevents: false
  nodemon: false

overrides:
  "express@<4.22.3": "4.22.3"
  "json5@<1.0.2": "1.0.2"
  "json5@>=2.0.0 <2.2.3": "2.2.3"
  "qs@<6.17.1": "6.17.1"
  "loader-utils@>=1.0.0 <1.4.2": "1.4.2"
  "async@>=2.0.0 <2.6.4": "2.6.4"
  "async@>=3.0.0 <3.2.6": "3.2.6"
  "minimist@>=1.0.0 <1.2.8": "1.2.8"
  "follow-redirects@<1.16.3": "1.16.3"
  "tmpl@<1.0.5": "1.0.5"
